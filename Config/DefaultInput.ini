; Old-school survival-horror tank controls.
; W/S or Up/Down move only along the character's facing direction.
+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=-1.000000,Key=S)
+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=Up)
+AxisMappings=(AxisName="MoveForward",Scale=-1.000000,Key=Down)
+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=Gamepad_LeftY)

; A/D or Left/Right rotate the character. There is intentionally no strafing.
+AxisMappings=(AxisName="Turn",Scale=-1.000000,Key=A)
+AxisMappings=(AxisName="Turn",Scale=1.000000,Key=D)
+AxisMappings=(AxisName="Turn",Scale=-1.000000,Key=Left)
+AxisMappings=(AxisName="Turn",Scale=1.000000,Key=Right)
+AxisMappings=(AxisName="Turn",Scale=1.000000,Key=Gamepad_LeftX)

